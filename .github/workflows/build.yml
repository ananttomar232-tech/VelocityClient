name: Build Velocity Client

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Velocity Client
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Package download
        run: |
          mkdir -p dist
          cp build/libs/velocity-client-*.jar dist/
          cp installer/* dist/
          cp README.md dist/

      - name: Upload Velocity Client
        uses: actions/upload-artifact@v4
        with:
          name: Velocity-Client
          path: dist/

      - name: Publish release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

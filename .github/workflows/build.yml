name: Build Velocity Client

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Velocity Client
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Check Modrinth projects (temporary)
        run: |
          check() {
            r=$(curl -s "https://api.modrinth.com/v2/project/$1/version?loaders=%5B%22$2%22%5D&game_versions=%5B%221.21.1%22%5D" -H "User-Agent: VelocityClient-CI")
            a=$(curl -s "https://api.modrinth.com/v2/project/$1/version?loaders=%5B%22$2%22%5D" -H "User-Agent: VelocityClient-CI")
            t=$(curl -s "https://api.modrinth.com/v2/project/$1" -H "User-Agent: VelocityClient-CI" | jq -r '"\(.title) [\(.project_type)] client=\(.client_side) server=\(.server_side) downloads=\(.downloads)"' 2>/dev/null)
            echo "MODRINTH $1 ($2): 1.21.1=$(echo "$r" | jq 'length' 2>/dev/null) any=$(echo "$a" | jq 'length' 2>/dev/null) deps=$(echo "$r" | jq -c '[.[0].dependencies[]? | select(.dependency_type=="required") | .project_id]' 2>/dev/null) :: $t"
          }
          for m in iris modernfix krypton noisium badoptimizations entitytexturefeatures entity-model-features not-enough-animations wavey-capes fallingleaves falling-leaves animatica eating-animation 3dskinlayers smooth-swapping continuity cit-resewn; do check $m fabric; done
          for p in fresh-animations xalis-enchanted-books animated-items waving-plants better-flames colorful-hearts icons simple-icons better-leaves fast-better-grass default-dark-mode low-on-fire clear-glass better-icons animated-icons enhanced-boss-bars fresh-moves even-better-enchants better-hotbar-icons vanilla-experience; do check $p minecraft; done
          for s in makeup-ultra-fast-shaders; do check $s iris; done

      - name: Check installer script syntax
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/installer/velocity-installer.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
          Write-Host 'Installer script parses OK'

      - name: Package download
        run: |
          mkdir -p dist
          cp build/libs/velocity-client-*.jar dist/
          cp installer/* dist/
          cp README.md dist/

      - name: Upload Velocity Client
        uses: actions/upload-artifact@v4
        with:
          name: Velocity-Client
          path: dist/

      - name: Publish release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # Starts the real game on a virtual screen, opens every Velocity screen, screenshots it and quits.
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Run Minecraft with Velocity
        env:
          VELOCITY_SMOKE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          chmod +x gradlew
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --stacktrace 2>&1 | tee run.log
          grep -q "VELOCITY SMOKE TEST PASSED" run.log

      - name: Upload screenshots and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Smoke-Test-Screenshots
          path: |
            run/screenshots/
            run/logs/latest.log
            run/crash-reports/
          if-no-files-found: ignore

